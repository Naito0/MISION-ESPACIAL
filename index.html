<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Garden</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
    <link rel="stylesheet" href="/src/aventura/ui/estilos.css" />
    <!-- Estilos de la pantalla de carga: van aquí para que se vean ANTES de que baje el juego -->
    <style>
      #carga { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, #13224a, #05070f 70%); color: #f2f5ff; font-family: Arial, Helvetica, sans-serif; transition: opacity 0.6s; }
      #carga h1 { margin: 0; font-size: 40px; color: #7cf3ff; }
      #carga .cohete { font-size: 64px; animation: subir 1.2s ease-in-out infinite alternate; }
      #carga .barra { width: min(520px, 80vw); height: 22px; border: 2px solid #3fd0ff; border-radius: 12px; overflow: hidden; background: #0b1328; }
      #carga .relleno { height: 100%; width: 5%; background: linear-gradient(90deg, #3fd0ff, #5be08a); transition: width 0.3s; }
      #carga .texto { font-size: 22px; color: #c8d4f0; }
      @keyframes subir { from { transform: translateY(6px); } to { transform: translateY(-6px); } }
    </style>
  </head>
  <body>
    <!-- Pantalla de carga con barra de progreso (main3d.js la actualiza y la quita) -->
    <div id="carga">
      <div class="cohete">🚀</div>
      <h1>🌱 Space Garden</h1>
      <div class="barra"><div class="relleno"></div></div>
      <div class="texto">Descargando el juego…</div>
    </div>
    <!-- Aquí Three.js crea el canvas 3D -->
    <div id="mundo3d"></div>
    <!-- Interfaz (HTML) superpuesta al mundo 3D: HUD, menús, consolas holográficas -->
    <div id="hud"></div>
    <script type="module" src="/src/aventura/main3d.js"></script>
  </body>
</html>
